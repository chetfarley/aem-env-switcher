<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AEM Env Switcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link rel="stylesheet" href="style.css">
  <!--
    md-bundle.js is built from src/md-imports.js via:  npm run build
    It is a local ESM file — no CDN, no CSP issues.
  -->
  <script type="module" src="swc-bundle.js"></script>
</head>
<body class="popup">
<sp-theme id="sp-theme" scale="medium" color="light">

  <!-- ── Toolbar ─────────────────────────────────────────────────────────── -->
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="AEM Environment Switcher">

    <!-- Environment selector -->
    <div class="toolbar__env">
      <md-filled-select id="envSelect" label="Environment">
        <!-- Populated dynamically by popup.js -->
      </md-filled-select>
    </div>

    <!-- Instance action buttons -->
    <div class="toolbar__actions" role="group" aria-label="View instance">
      <md-filled-button id="btn-editor" class="instance-btn">
        Editor
      </md-filled-button>

      <md-filled-button id="btn-preview" class="instance-btn">
        Preview
      </md-filled-button>

      <!-- Published: direct link OR dropdown for language-master pages -->
      <div class="published-anchor">
        <md-filled-button
          id="btn-published"
          class="instance-btn"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          Published
          <!--
            The arrow icon lives in slot="icon" with trailing-icon on the button.
            JS adds/removes the .has-dropdown class on .published-anchor;
            CSS uses that to show/hide the icon and stretch the button width.
          -->
          <md-icon slot="icon" aria-hidden="true">arrow_drop_down</md-icon>
        </md-filled-button>
        <!--
          anchor/anchorElement set via JS — the HTML `anchor` attribute is
          deprecated in newer @material/web builds.
          menu-corner / anchor-corner position the menu below-start of the button.
        -->
        <md-menu
          id="published-menu"
          positioning="fixed"
          anchor-corner="end-start"
          menu-corner="start-start"
          x-offset="0"
          y-offset="4"
          role="menu"
          aria-label="Published live copies"
        >
          <!-- Populated dynamically for language-master pages -->
        </md-menu>
      </div>
    </div>

    <!-- Vertical divider -->
    <div class="toolbar__divider" aria-hidden="true"></div>

    <!-- Settings + close -->
    <div class="toolbar__meta">
      <md-icon-button id="btn-menu" title="Settings">
        <md-icon>settings</md-icon>
      </md-icon-button>

      <md-icon-button id="btn-close" title="Close">
        <md-icon>close</md-icon>
      </md-icon-button>
    </div>

  </div>
  <!-- /toolbar -->

  <!-- ── Context bar ─────────────────────────────────────────────────────── -->
  <div class="context-bar" id="contextBar" aria-live="polite">
    <span class="context-bar__type" id="contextLabel"></span>
    <span class="context-bar__url"  id="currentUrl"></span>
  </div>

  <!--
    popup.js is loaded with defer so it executes after the module (md-bundle.js)
    has already registered the custom elements. No DOMContentLoaded needed.
  -->
  <script src="popup.js" defer></script>

</sp-theme>
</body>
</html>
